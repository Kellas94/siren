  qualification:
    name: Desktop qualification
    needs: [windows, native_windows, packaged_windows]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Require development and packaged results
        shell: pwsh
        env:
          SIREN_DEVELOPMENT_RESULT: ${{ needs.windows.result }}
          SIREN_NATIVE_RESULT: ${{ needs.native_windows.result }}
          SIREN_PACKAGED_RESULT: ${{ needs.packaged_windows.result }}
        run: |
          if ($env:SIREN_DEVELOPMENT_RESULT -ne 'success' -or $env:SIREN_NATIVE_RESULT -ne 'success' -or $env:SIREN_PACKAGED_RESULT -ne 'success') {
            throw "Desktop qualification incomplete: development=$env:SIREN_DEVELOPMENT_RESULT; native=$env:SIREN_NATIVE_RESULT; packaged=$env:SIREN_PACKAGED_RESULT"
          }
