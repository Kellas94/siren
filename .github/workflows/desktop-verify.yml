name: Desktop prototype verification
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Locked dependencies
        run: npm ci --no-fund --no-update-notifier
      - name: Install pinned Electron runtime explicitly
        timeout-minutes: 5
        run: npm run runtime:install
      - name: Diagnose owned temporary fixture paths
        timeout-minutes: 1
        run: |
          node --input-type=module -e 'import{tmpdir}from"node:os";import{realpath}from"node:fs/promises";console.log(JSON.stringify({temporary:tmpdir(),canonical:await realpath(tmpdir())}))'
          node --test --test-reporter=tap tests/io.test.mjs
          exit $LASTEXITCODE
      - name: Unit and protocol behavior (includes real 180-second timeout)
        # CI27 exhausted six minutes before the expanded suite completed.
        # Individual behavioral deadlines remain unchanged; keep this bounded.
        timeout-minutes: 12
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          # Native process identity must not compete with large editor/storage
          # worker fixtures. Preserve the product's bounded unknown/refusal path.
          $identityFiles = @('tests/process-identity-deadline.test.mjs', 'tests/process-identity.test.mjs')
          foreach ($identityFile in $identityFiles) {
            if (-not (Test-Path -LiteralPath $identityFile -PathType Leaf)) { throw 'Required native identity test missing' }
          }
          node --test --test-concurrency=1 --test-reporter=tap @identityFiles 2>&1 | Tee-Object -FilePath evidence/ci-native-identity.log
          $identityExit = $LASTEXITCODE
          $otherFiles = @(Get-ChildItem -LiteralPath tests -Filter '*.test.mjs' -File |
            Where-Object { $_.Name -notin @('process-identity-deadline.test.mjs', 'process-identity.test.mjs') } |
            Sort-Object Name | ForEach-Object { "tests/$($_.Name)" })
          if ($otherFiles.Count -eq 0) { throw 'Required unit tests missing' }
          node --test --test-reporter=tap @otherFiles 2>&1 | Tee-Object -FilePath evidence/ci-units.log
          $unitsExit = $LASTEXITCODE
          if ($identityExit -ne 0 -or $unitsExit -ne 0) { exit 1 }
          exit 0
      - name: Guarded renderer
        run: node build/renderer.mjs baseline/R78.html generated
      - name: Actual development renderer and protected storage
        run: |
          $nativeFailures = @()
          foreach ($nativeScript in @('shell', 'protected-storage', 'account-transition', 'code-windows', 'desktop-ui', 'code-recovery', 'recovery-zoom', 'code-diagram-interaction', 'guided-intro', 'dev-first-run', 'access-screen', 'local-pin', 'headless-import')) {
            Write-Output "Native behavior: $nativeScript"
            node "tests/native/$nativeScript.mjs"
            if ($LASTEXITCODE -ne 0) { $nativeFailures += $nativeScript }
          }
          if ($nativeFailures.Count -gt 0) { throw "Native checks failed: $($nativeFailures -join ', ')" }
      - name: Development package identity (not publication or release admission)
        run: |
          $sourceCommit = git rev-parse HEAD
          $packageJson = node scripts/package.mjs $sourceCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preview = $packageJson | ConvertFrom-Json
          node tests/native/packaged.mjs $preview.previewRoot
          exit $LASTEXITCODE
      - name: Retain scoped test evidence in private CI
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-development-evidence
          path: |
            desktop/evidence/ci-units.log
            desktop/evidence/ci-native-identity.log
            desktop/evidence/*/result.json
            desktop/evidence/*/failure-state.json
            desktop/evidence/*/failure.json
            desktop/evidence/*/failure-events.json
            desktop/evidence/*/save-diagnostic.json
            desktop/evidence/*/restore-boundary.json
            desktop/evidence/*/recovered-at-restore.json
            desktop/evidence/*/recovered-initial-revision.json
            desktop/evidence/*/folder-copy.json
            desktop/evidence/*/*.png
            desktop/evidence/*/*.log
            desktop/evidence/headless-import/*/result.json
            desktop/evidence/headless-import/*/native-result.json
            desktop/evidence/headless-import/*/prepared.json
            desktop/evidence/headless-import/*/electron.log
            desktop/dist/*/BUILD-IDENTITY.json
          if-no-files-found: warn
          retention-days: 14
