  packaged_windows:
    name: Windows packaged workspaces
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Locked dependencies
        run: npm ci --no-fund --no-update-notifier
      - name: Install pinned Electron runtime explicitly
        timeout-minutes: 5
        run: npm run runtime:install
      - name: Diagnose owned temporary fixture paths
        timeout-minutes: 1
        run: |
          node --input-type=module -e 'import{tmpdir}from"node:os";import{realpath}from"node:fs/promises";console.log(JSON.stringify({temporary:tmpdir(),canonical:await realpath(tmpdir())}))'
          node --test --test-reporter=tap tests/io.test.mjs
          exit $LASTEXITCODE
      - name: Development package identity (not publication or release admission)
        run: |
          $sourceCommit = git rev-parse HEAD
          $packageJson = node scripts/package.mjs $sourceCommit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preview = $packageJson | ConvertFrom-Json
          node tests/native/packaged.mjs $preview.previewRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/source-analysis.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/source-diff.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/source-map.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/source-link.mjs --package $preview.previewRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/source-sync.mjs --package $preview.previewRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/docs-edit.mjs --package $preview.previewRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/diagram-preview.mjs --package $preview.previewRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/diagram-edit.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/diagram-guided.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/diagram-style.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/diagram-export.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/diagram-build.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/docs-structured.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { throw "Packaged structured Docs failed" }
          node tests/native/home-library-search.mjs --package $preview.previewRoot
          if ($LASTEXITCODE -ne 0) { throw "Packaged Home name search failed" }
          node tests/native/home-documents.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { throw "Packaged new Docs failed" }
          node tests/native/source-edit.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { throw "Packaged Code editing failed" }
          node tests/native/home-source-projects.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { throw "Packaged Home source projects failed" }
          node tests/native/source-link-create.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native/docs-sources.mjs --package $preview.previewRoot --300k
          if ($LASTEXITCODE -ne 0) { throw "Packaged Docs source opening failed" }
          node tests/native/presentation-windows.mjs --lines 300000 --package $preview.previewRoot
          exit $LASTEXITCODE
      - name: Retain scoped test evidence in private CI
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-packaged-evidence
          path: |
            desktop/evidence/ci-units.log
            desktop/evidence/ci-native-identity.log
            desktop/evidence/*/result.json
            desktop/evidence/*/failure-state.json
            desktop/evidence/*/failure.json
            desktop/evidence/*/diagnostic.json
