        run: node tests/native/pin-crash-recovery.mjs
      - name: Actual Home saved-backup export
        if: matrix.group == 'desktop'
        run: node tests/native/home-backup-export.mjs
      - name: Actual Docs saved-document export
        if: matrix.group == 'desktop'
        run: node tests/native/docs-export.mjs
      - name: Actual Docs Activity
        if: matrix.group == 'desktop'
        run: node tests/native/docs-activity.mjs
      - name: Actual Presenter captured-notes export
        if: matrix.group == 'desktop'
