name: Fresh Terminal original-command pair (diagnostic only)
on:
  push:
    branches: ['probe/terminal-session-20261010']
    paths: ['.github/workflows/terminal-fresh-runtime-pair.yml']
permissions:
  contents: read
concurrency:
  group: terminal-fresh-runtime-pair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Explicit fixed diagnostic on the test branch; never product admission.
    if: github.repository == 'Kellas94/siren' && github.ref == 'refs/heads/probe/terminal-session-20261010' && github.run_attempt == 1
    runs-on: windows-2025
    # Step caps total 62 minutes, leaving four minutes for job overhead.
    # Build has a separate cap so archive/upload still have reserved time.
    timeout-minutes: 66
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        timeout-minutes: 3
        with:
          node-version: '24.16.0'
      - name: Record owned launch evidence and select existing Python
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'Kellas94/siren' -or $env:GITHUB_REF -cne 'refs/heads/probe/terminal-session-20261010') { throw 'Unexpected hosted context' }
          $launchEvidence = Join-Path $env:RUNNER_TEMP 'siren-fresh-build-launch'
          New-Item -ItemType Directory -Path $launchEvidence -ErrorAction Stop | Out-Null
          $pythonCommand = Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if (@($pythonCommand).Count -ne 1) { throw 'Ambiguous Python executable' }
          $env:pythonLocation = [System.IO.Path]::GetDirectoryName($pythonCommand.Source)
          & $pythonCommand.Source -I -c 'import sys; assert sys.version_info >= (3, 12); print(sys.version)' > (Join-Path $launchEvidence 'python-version.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 or later is required' }
          "pythonLocation=$env:pythonLocation" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash -LiteralPath $pythonCommand.Source -Algorithm SHA256 | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $launchEvidence 'python-executable.json') -Encoding utf8
      - name: Build once with bounded external compiler snapshots and compare the two fixed original-command arms
        timeout-minutes: 31
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launchEvidence = Join-Path $env:RUNNER_TEMP 'siren-fresh-build-launch'
          & node desktop/tests/native/terminal-fresh-runtime-provision.mjs --fixed-pathext-pair > (Join-Path $launchEvidence 'build.stdout.txt') 2> (Join-Path $launchEvidence 'build.stderr.txt')
          $buildExit = $LASTEXITCODE
          $buildExit | Set-Content -LiteralPath (Join-Path $launchEvidence 'build.exit.txt') -Encoding ascii
          exit $buildExit
      - name: Archive every owned job tree including hidden files and empty directories
        timeout-minutes: 8
        id: archive
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePython = Join-Path $env:pythonLocation 'python.exe'
          & $archivePython -I desktop/tests/native/terminal_fresh_build_archive.py
          exit $LASTEXITCODE
      - name: Retain complete archives and pinned build inputs on every outcome
        timeout-minutes: 8
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-fresh-runtime-pair-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          path: |
            ${{ runner.temp }}/siren-fresh-build-launch/**
            desktop/tests/native/.gitattributes
            desktop/tests/native/terminal-fresh-runtime-provision-inputs.json
            desktop/tests/native/terminal-fresh-runtime-provision.mjs
            desktop/tests/native/terminal_historical_source_stage.py
            desktop/tests/native/terminal_fresh_build_archive.py
            desktop/tests/native/terminal-fresh-runtime-inventory.mjs
            desktop/tests/native/terminal-fresh-runtime-retention.mjs
            desktop/tests/native/terminal-connect-derivative.mjs
            desktop/tests/native/terminal-creator-transport-derivative.mjs
            desktop/tests/native/terminal-connect-raw-json.mjs
            desktop/tests/native/terminal-connect-raw-file.mjs
            desktop/tests/native/terminal-connect-comparison.mjs
            desktop/tests/native/terminal-fresh-environment.mjs
            desktop/tests/native/terminal-fresh-pair-model.mjs
            terminal-fresh-provisioner-preparation-20261011/pins.json
            terminal-fresh-provisioner-preparation-20261011/historical-source-mapping.json
            terminal-fresh-provisioner-preparation-20261011/historical-execution-mapping.json
            terminal-fresh-provisioner-preparation-20261011/resource-manifest-design.json
            terminal-fresh-provisioner-preparation-20261011/source-snapshots/012-package.json.txt
            terminal-fresh-provisioner-preparation-20261011/source-snapshots/011-package-lock.json.txt
            terminal-fresh-provisioner-preparation-20261011/source-snapshots/062-terminal-filesystem-evidence.cs.txt
            terminal-fresh-provisioner-preparation-20261011/source-snapshots/063-terminal-session-process-observer.cs.txt
            terminal-resolution-observation-20261011/hosted-v1.zip
            desktop/tests/native/terminal-fresh-pair-driver.mjs
            desktop/tests/native/terminal-fresh-pair-worker.mjs
            desktop/tests/native/terminal-resolution-observation.mjs
            desktop/tests/native/terminal-discovery-fixture.mjs
            desktop/tests/native/terminal-cmdlet-fixture.mjs
            desktop/tests/native/terminal-session-command.mjs
            .github/workflows/terminal-fresh-runtime-build.yml
            .github/workflows/terminal-fresh-runtime-pair.yml
      - name: Preserve readable partial raw trees if complete archival failed
        timeout-minutes: 8
        if: ${{ always() && steps.archive.outcome != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-fresh-runtime-partial-raw-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 6
          path: ${{ runner.temp }}/siren-fresh-runtime-*/**
