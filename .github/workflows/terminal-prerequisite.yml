name: Terminal native prerequisites
on:
  push:
    branches: ['probe/terminal-native-2026-10-08']
  pull_request:
    paths:
      - '.github/workflows/terminal-prerequisite.yml'
      - 'desktop/tests/native/terminal-job-list.mjs'
      - 'desktop/tests/fixtures/terminal-job-list.cs'
      - 'desktop/tests/native/terminal-ownership-addon.mjs'
      - 'desktop/tests/native/build-terminal-ownership.mjs'
      - 'desktop/tests/native/terminal-ownership-oracle.test.mjs'
      - 'desktop/tests/native/terminal-job-lifetime.mjs'
      - 'desktop/tests/native/terminal-job-lifetime-verdict.mjs'
      - 'desktop/tests/native/terminal-job-lifetime-verdict.test.mjs'
      - 'desktop/tests/fixtures/terminal-ownership/**'
      - 'desktop/tests/native/terminal-host-guard*.mjs'
      - 'desktop/tests/native/build-terminal-host-guard.mjs'
      - 'desktop/tests/fixtures/terminal-host-guard/**'
      - 'desktop/tests/native/terminal-main-owner-loss*.mjs'
      - 'desktop/tests/native/build-terminal-main-owner-loss.mjs'
      - 'desktop/tests/fixtures/terminal-main-owner-observer.cs'
      - 'desktop/tests/native/terminal-conpty-membership*.mjs'
      - 'desktop/tests/native/build-terminal-conpty-membership.mjs'
      - 'desktop/tests/fixtures/terminal-conpty-membership.cs'
      - 'desktop/tests/native/terminal-conpty-broker-*.mjs'
      - 'desktop/tests/native/build-terminal-conpty-broker-membership.mjs'
      - 'desktop/tests/fixtures/terminal-conpty-broker-membership.cs'
      - 'desktop/tests/native/terminal-conpty-platform*.mjs'
      - 'desktop/tests/native/terminal-candidate-graph*.mjs'
      - 'desktop/tests/native/terminal-electron-broker*.mjs'
      - 'desktop/tests/native/build-terminal-electron-broker.mjs'
      - 'desktop/tests/fixtures/terminal-electron-broker.cs'
      - 'desktop/tests/native/terminal-electron-capacity*.mjs'
      - 'desktop/tests/native/build-terminal-electron-capacity.mjs'
      - 'desktop/tests/fixtures/terminal-electron-capacity.cs'
      - 'desktop/tests/native/*terminal-session-composition*.mjs'
      - 'desktop/tests/fixtures/terminal-session-composition*'
      - 'desktop/tests/native/*terminal-composed-main-loss*.mjs'
      - 'desktop/tests/native/*terminal-composition-eight*.mjs'
      - 'desktop/tests/native/*terminal-eight-main-loss*.mjs'
      - 'desktop/tests/native/*terminal-shell-flow*.mjs'
      - 'desktop/tests/native/*terminal-aggregate-flow*.mjs'
      - 'desktop/tests/native/terminal-publication-closure*.mjs'
      - 'desktop/tests/fixtures/terminal-shell-flow-publication-before.json'
      - 'desktop/tests/fixtures/terminal-shell-flow-observer.cs'
      - 'desktop/src/terminal/**'
      - 'desktop/tests/fixtures/terminal-composed-main-loss*'
      - 'desktop/tests/fixtures/terminal-node-pty/package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win32-job-list:
    name: Win32 Job-list and OS object-lifetime prerequisites (not Terminal admission)
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
      - name: Check shell-flow publication closure before native work
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-publication-closure.test.mjs
          exit $LASTEXITCODE
      - name: Check aggregate flow closure before native work
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-aggregate-flow-delivery.test.mjs desktop/tests/native/terminal-aggregate-flow-probe.test.mjs desktop/tests/native/terminal-aggregate-flow-verdict.test.mjs desktop/tests/native/terminal-aggregate-flow-workflow.test.mjs
          exit $LASTEXITCODE
      - name: Record available build tools without installing dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path desktop/evidence -Force | Out-Null
          $discovery = [ordered]@{ schema = 1; purpose = 'Discovery only; no C++ addon built or admitted'; image = $env:ImageVersion; visualStudio = @(); compilers = @(); sdks = @() }
          $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (Test-Path -LiteralPath $locator -PathType Leaf) {
            $locations = @(& $locator -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
            if ($LASTEXITCODE -ne 0) { throw 'Compiler discovery failed' }
            foreach ($location in $locations) {
              $discovery.visualStudio += $location
              $toolsRoot = Join-Path $location 'VC/Tools/MSVC'
              if (Test-Path -LiteralPath $toolsRoot -PathType Container) {
                foreach ($version in Get-ChildItem -LiteralPath $toolsRoot -Directory) {
                  foreach ($name in @('cl.exe', 'link.exe')) {
                    $tool = Join-Path $version.FullName "bin/Hostx64/x64/$name"
                    if (Test-Path -LiteralPath $tool -PathType Leaf) {
                      $discovery.compilers += @{ path = $tool; sha256 = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() }
                    }
                  }
                }
              }
            }
          }
          $kits = Get-ItemProperty -LiteralPath 'HKLM:/SOFTWARE/Microsoft/Windows Kits/Installed Roots' -ErrorAction SilentlyContinue
          if ($kits -and $kits.KitsRoot10) {
            $sdkRoot = Join-Path $kits.KitsRoot10 'Include'
            if (Test-Path -LiteralPath $sdkRoot -PathType Container) {
              $discovery.sdks = @(Get-ChildItem -LiteralPath $sdkRoot -Directory | Select-Object -ExpandProperty FullName)
            }
          }
          $discovery | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath desktop/evidence/terminal-build-tool-discovery.json -Encoding utf8
      - name: Check prerequisite deadline and failure oracles
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-ownership-oracle.test.mjs desktop/tests/native/terminal-job-lifetime-verdict.test.mjs desktop/tests/native/terminal-host-guard-verdict.test.mjs desktop/tests/native/terminal-host-guard-oracle.test.mjs desktop/tests/native/terminal-main-owner-loss-verdict.test.mjs desktop/tests/native/terminal-main-owner-loss-oracle.test.mjs desktop/tests/native/terminal-conpty-membership-verdict.test.mjs desktop/tests/native/terminal-conpty-broker-verdict.test.mjs desktop/tests/native/terminal-conpty-broker-derive.test.mjs desktop/tests/native/terminal-electron-broker-verdict.test.mjs desktop/tests/native/terminal-main-owner-loss-coverage.test.mjs desktop/tests/native/terminal-electron-capacity-verdict.test.mjs desktop/tests/native/terminal-electron-capacity-derive.test.mjs desktop/tests/native/terminal-conpty-platform.test.mjs desktop/tests/native/terminal-conpty-platform-worker.test.mjs desktop/tests/native/terminal-candidate-graph.test.mjs desktop/tests/native/terminal-candidate-graph-builders.test.mjs desktop/tests/native/terminal-candidate-graph-resolution.test.mjs
          exit $LASTEXITCODE
      - name: Compile fixed fixtures and test actual Windows ownership
        shell: pwsh
        timeout-minutes: 2
        run: |
          node desktop/tests/native/terminal-job-list.mjs
          exit $LASTEXITCODE
      - name: Check composed-session derivation and adverse readback rules
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-session-composition-derive.test.mjs desktop/tests/native/terminal-session-composition-verdict.test.mjs desktop/tests/native/terminal-session-composition-consistency.test.mjs desktop/tests/native/terminal-session-composition-startup.test.mjs
          exit $LASTEXITCODE
      - name: Verify composed abrupt-main-loss readback and exact source derivation
        shell: pwsh
        run: |
          node --test desktop/tests/native/terminal-composed-main-loss-derive.test.mjs desktop/tests/native/terminal-composed-main-loss-verdict.test.mjs
          exit $LASTEXITCODE
      - name: Install existing locked build dependencies without lifecycle scripts
        shell: pwsh
        working-directory: desktop
        timeout-minutes: 2
        run: npm ci --ignore-scripts --no-fund --no-update-notifier
      - name: Install exact existing Electron runtime explicitly
        shell: pwsh
        working-directory: desktop
        timeout-minutes: 2
        run: npm run runtime:install
      - name: Build isolated native canaries and verify actual OS lifetime in Electron
        shell: pwsh
        timeout-minutes: 6
        run: |
          node desktop/tests/native/build-terminal-ownership.mjs desktop/evidence/terminal-build-tool-discovery.json --job-lifetime
          exit $LASTEXITCODE
      - name: Build isolated native host guard and verify native host-loss cleanup
        shell: pwsh
        timeout-minutes: 6
        run: |
          node desktop/tests/native/build-terminal-host-guard.mjs desktop/evidence/terminal-build-tool-discovery.json
          exit $LASTEXITCODE
      - name: Verify abrupt Electron main loss with external held-handle observer
        shell: pwsh
        timeout-minutes: 3
        run: |
          node desktop/tests/native/build-terminal-main-owner-loss.mjs
          exit $LASTEXITCODE
      - name: Observe actual ConPTY helper and atomic session Job membership
        shell: pwsh
        timeout-minutes: 2
        run: |
          node desktop/tests/native/build-terminal-conpty-membership.mjs
          exit $LASTEXITCODE
      - name: Observe helpers created inside atomically Session-contained workers
        shell: pwsh
        timeout-minutes: 2
        run: |
          node desktop/tests/native/build-terminal-conpty-broker-membership.mjs
          exit $LASTEXITCODE
      - name: Install isolated exact existing PTY candidate without lifecycle scripts
        shell: pwsh
        working-directory: desktop/tests/fixtures/terminal-node-pty
        timeout-minutes: 2
        run: |
          npm ci --ignore-scripts --no-fund --no-update-notifier
          exit $LASTEXITCODE
      - name: Observe actual pre-contained Electron and OS ConPTY workers
        shell: pwsh
        timeout-minutes: 2
        run: |
          node desktop/tests/native/build-terminal-electron-broker.mjs
          exit $LASTEXITCODE
      - name: Observe eight actual Electron creators and isolated session Stop
        shell: pwsh
        timeout-minutes: 2
        run: |
          node desktop/tests/native/build-terminal-electron-capacity.mjs
          exit $LASTEXITCODE
      - name: Observe actual composed native Session and Host/root lifetimes
        shell: pwsh
        timeout-minutes: 3
        run: |
          node desktop/tests/native/build-terminal-session-composition.mjs
          exit $LASTEXITCODE
      # The separate control kills only the held main process before first-go.
      # It never relies on main to publish a successful native result.
      - name: Observe composed abrupt main loss with external held identities
        shell: pwsh
        timeout-minutes: 3
        run: |
          node desktop/tests/native/build-terminal-composed-main-loss.mjs
          exit $LASTEXITCODE
      - name: Check eight-session orchestration and adverse readback
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-composition-eight-derive.test.mjs desktop/tests/native/terminal-composition-eight-verdict.test.mjs desktop/tests/native/terminal-composition-eight-startup.test.mjs
          exit $LASTEXITCODE
      - name: Observe eight simultaneous composed Sessions and ninth refusal
        shell: pwsh
        timeout-minutes: 3
        run: |
          node desktop/tests/native/build-terminal-composition-eight.mjs
          exit $LASTEXITCODE
      - name: Check eight-session abrupt-main-loss adverse readback
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-eight-main-loss-derive.test.mjs desktop/tests/native/terminal-eight-main-loss-verdict.test.mjs desktop/tests/native/terminal-eight-main-loss-startup.test.mjs desktop/tests/native/terminal-eight-main-loss-workflow.test.mjs
          exit $LASTEXITCODE
      - name: Observe eight composed Sessions under abrupt main loss
        shell: pwsh
        timeout-minutes: 3
        run: |
          node desktop/tests/native/build-terminal-eight-main-loss.mjs
          exit $LASTEXITCODE
      # A separate actual-shell experiment; earlier twelve-second controls
      # remain unchanged. Product Terminal admission is still withheld.
      - name: Check fixed shell-flow control and adverse readback
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/native/terminal-shell-flow-core.test.mjs desktop/tests/native/terminal-shell-flow-controller.test.mjs desktop/tests/native/terminal-shell-flow-mailbox.test.mjs desktop/tests/native/terminal-shell-flow-probe.test.mjs desktop/tests/native/terminal-shell-flow-startup.test.mjs desktop/tests/native/terminal-shell-flow-derive.test.mjs desktop/tests/native/terminal-shell-flow-verdict.test.mjs desktop/tests/native/terminal-shell-flow-workflow.test.mjs desktop/tests/native/terminal-shell-flow-review-regression.test.mjs desktop/tests/native/terminal-shell-flow-conservation.test.mjs
          exit $LASTEXITCODE
      - name: Observe fixed PowerShell input Lock and bounded flood
        shell: pwsh
        timeout-minutes: 5
        run: |
          node desktop/tests/native/build-terminal-shell-flow.mjs
          exit $LASTEXITCODE
      - name: Observe eight PowerShell Sessions with shared credits
        shell: pwsh
        timeout-minutes: 5
        run: |
          node desktop/tests/native/build-terminal-aggregate-flow.mjs
          exit $LASTEXITCODE
      - name: Retain original prerequisite receipts
        # Eight main-loss controls have a distinct evidence namespace.
        # Their actual outcome is retained even if qualification refuses.
        # All native outcomes, including a failed candidate, retain originals.
        # The new workers are a separate experiment; earlier results stay intact.
        # Generated EXEs are evidence only, retained opaquely and never rerun.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-win32-prerequisite
