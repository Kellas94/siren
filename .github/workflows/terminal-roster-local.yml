name: Terminal shutdown qualification (not admitted)
on:
  push:
    branches: ['probe/terminal-roster-20261010']
permissions:
  contents: read
concurrency:
  group: terminal-roster-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-node:
    if: github.repository == 'Kellas94/siren' && github.ref == 'refs/heads/probe/terminal-roster-20261010'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Pure fixture and verdict tests
        shell: pwsh
        timeout-minutes: 1
        run: |
          node --test desktop/tests/terminal-local-native-fixture.test.mjs desktop/tests/terminal-local-case-verdict.test.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --test desktop/tests/terminal-roster-diagnostic-derive.test.mjs desktop/tests/terminal-roster-fixed-diagnostic-derive.test.mjs desktop/tests/terminal-local-worker-contract.test.mjs desktop/tests/terminal-host-roster-candidate-derive.test.mjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node --expose-gc --test desktop/tests/terminal-shutdown-graph.test.mjs desktop/tests/terminal-graph-native-verdict.test.mjs desktop/tests/terminal-graph-native-evidence.test.mjs
          exit $LASTEXITCODE
      - name: Compile exact candidate with verified official inputs
        shell: pwsh
        timeout-minutes: 3
        run: ./desktop/tests/native/build-terminal-roster-ci.ps1
      - name: Run ten native scenarios under independent Safety Job
        shell: pwsh
        timeout-minutes: 5
        run: |
          $taskOutput="desktop/evidence/terminal-roster-ci/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/observation"
          node desktop/tests/native/terminal-host-roster-local-runner.mjs $taskOutput
          exit $LASTEXITCODE
      - name: Recheck actual case records
        shell: pwsh
        run: |
          $taskOutput="desktop/evidence/terminal-roster-ci/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/observation"
          node desktop/tests/native/verify-terminal-local-run.mjs $taskOutput
          exit $LASTEXITCODE
      - name: Run actual private graph with the same native candidate
        shell: pwsh
        timeout-minutes: 2
        run: |
          $taskRoot="desktop/evidence/terminal-roster-ci/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node desktop/tests/native/terminal-graph-native-runner.mjs "$taskRoot/graph-observation" "$taskRoot/observation/build/siren_terminal_host_roster_candidate.node"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node desktop/tests/native/verify-terminal-graph-native.mjs "$taskRoot/graph-observation"
          exit $LASTEXITCODE
      - name: Preserve raw results even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: terminal-roster-local-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          compression-level: 9
          if-no-files-found: error
          include-hidden-files: true
          path: |
            desktop/evidence/terminal-roster-ci/*/build-result.json
            desktop/evidence/terminal-roster-ci/*/compile.txt
            desktop/evidence/terminal-roster-ci/*/observation/**
            desktop/evidence/terminal-roster-ci/*/graph-observation/**
            desktop/tests/native/terminal-host-roster-local-*.mjs
            desktop/tests/native/terminal-local-*.mjs
            desktop/tests/native/verify-terminal-local-run.mjs
            desktop/tests/native/build-terminal-roster-ci.ps1
            desktop/tests/native/derive-terminal-roster-fixed-diagnostic.mjs
            desktop/tests/native/derive-terminal-roster-diagnostic.mjs
            desktop/tests/native/emit-terminal-host-exit-unit.mjs
            desktop/tests/fixtures/terminal-host-exit-unit.cpp
            desktop/tests/terminal-local-*.test.mjs
            desktop/tests/terminal-roster-fixed-diagnostic-derive.test.mjs
            desktop/tests/terminal-roster-diagnostic-derive.test.mjs
            desktop/tests/terminal-host-roster-candidate-derive.test.mjs
            desktop/build/terminal-host-roster-candidate-derive.mjs
            desktop/native/terminal-creator-host-async/**
            desktop/tests/fixtures/terminal-host-roster-*
            desktop/tests/fixtures/terminal-main-owner-observer.cs
            desktop/native/terminal-host-roster-candidate/**
            desktop/src/terminal/host-async-receipt-contract.mjs
