[package]
name = "siren-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = []
development-preview = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[[bin]]
name = "SIREN"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

