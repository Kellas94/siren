deck-list button{text-align:left;overflow-wrap:anywhere}.deck-list [aria-current=true]{background:#648dff22;border-color:#648dff}#diagramPresentationPanel{grid-row:4;overflow:auto;min-height:0;padding:20px;border:1px solid #78859a44;border-radius:12px;background:light-dark(#fff,#202127)}#diagramPresentationPanel h2{margin:0;font-size:22px;letter-spacing:-.03em}#presentationStepEditor label{display:block;font-size:12px;margin:15px 0}#presentationStepEditor input,#presentationStepEditor textarea,.deck-tools input{display:block;width:100%;box-sizing:border-box;margin:8px 0;min-width:0;font:inherit;padding:10px;border:1px solid #78859a55;border-radius:9px;background:light-dark(#fff,#26282f);color:inherit}#presentationStepEditor textarea{min-height:115px;resize:vertical}#diagramPresentationPanel input:focus-visible{outline:3px solid #648dff;outline-offset:2px}@media(max-width:650px){.deck-layout{grid-template-columns:1fr}.deck-list{max-height:120px;overflow:auto}#diagramPresentationPanel{padding:12px}}body[data-deck-mode=true] #toggleDiagramSource{display:none}.deck-table-scroll{max-width:100%;overflow:auto;margin:16px 0;border:1px solid #78859a44;border-radius:12px}.deck-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:360px}.deck-table td{padding:4px;vertical-align:top;border:1px solid #78859a33}#presentationStepEditor .deck-table textarea{font-size:13px;line-height:1.5;min-height:66px;min-width:100px;margin:0;padding:8px}#presentationStepEditor input[type=checkbox]{display:inline-block;width:16px;height:16px;margin:8px;vertical-align:middle;accent-color:var(--siren-accent,#648dff)}#diagramPresentationPanel textarea:focus-visible{outline:3px solid #648dff;outline-offset:2px}</style></head><body data-role="diagram"><main><header><h1 id="viewTitle">Diagrams</h1><select id="diagramTheme" aria-label="Diagram appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="togg
