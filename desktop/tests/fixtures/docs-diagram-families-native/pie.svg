<svg id="diagnosticFamily" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 584.09375 450" style="max-width: 584.09375px;" role="graphics-document document" aria-roledescription="pie"><style>#diagnosticFamily{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#2f2924;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagnosticFamily .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagnosticFamily .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagnosticFamily .error-icon{fill:#eee3d7;}#diagnosticFamily .error-text{fill:#2f2924;stroke:#2f2924;}#diagnosticFamily .edge-thickness-normal{stroke-width:1px;}#diagnosticFamily .edge-thickness-thick{stroke-width:3.5px;}#diagnosticFamily .edge-pattern-solid{stroke-dasharray:0;}#diagnosticFamily .edge-thickness-invisible{stroke-width:0;fill:none;}#diagnosticFamily .edge-pattern-dashed{stroke-dasharray:3;}#diagnosticFamily .edge-pattern-dotted{stroke-dasharray:2;}#diagnosticFamily .marker{fill:#75685d;stroke:#75685d;}#diagnosticFamily .marker.cross{stroke:#75685d;}#diagnosticFamily svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#diagnosticFamily p{margin:0;}#diagnosticFamily .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#diagnosticFamily .pieCircle.highlighted{scale:1.05;opacity:1;}#diagnosticFamily .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#diagnosticFamily .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#diagnosticFamily .pieTitleText{text-anchor:middle;font-size:25px;fill:#2f2924;font-family:"trebuchet ms",verdana,arial,sans-serif;}#diagnosticFamily .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#2f2924;font-size:17px;}#diagnosticFamily .legend text{fill:#2f2924;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#diagnosticFamily .node .neo-node{stroke:#7f6f60;}#diagnosticFamily [data-look="neo"].node rect,#diagnosticFamily [data-look="neo"].cluster rect,#diagnosticFamily [data-look="neo"].node polygon{stroke:url(#diagnosticFamily-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagnosticFamily [data-look="neo"].swimlane.cluster rect{filter:none;}#diagnosticFamily [data-look="neo"].node path{stroke:url(#diagnosticFamily-gradient);stroke-width:1px;}#diagnosticFamily [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagnosticFamily [data-look="neo"].node .neo-line path{stroke:#7f6f60;filter:none;}#diagnosticFamily [data-look="neo"].node circle{stroke:url(#diagnosticFamily-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagnosticFamily [data-look="neo"].node circle .state-start{fill:#000000;}#diagnosticFamily [data-look="neo"].icon-shape .icon{fill:url(#diagnosticFamily-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagnosticFamily [data-look="neo"].icon-shape .icon-neo path{stroke:url(#diagnosticFamily-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagnosticFamily :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-175.945,-57.168L0,0Z" fill="#fbf4e9" class="pieCircle"></path><path d="M-175.945,-57.168A185,185,0,0,1,0,-185L0,0Z" fill="#f2d9c8" class="pieCircle"></path><text transform="translate(81.55520375558065,112.25110796952396)" class="slice" style="text-anchor: middle;">80%</text><text transform="translate(-81.55520375558066,-112.25110796952394)" class="slice" style="text-anchor: middle;">20%</text></g><text x="0" y="-200" class="pieTitleText">Review outcomes</text><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(251, 244, 233); stroke: rgb(251, 244, 233);"></rect><text x="22" y="14">Accepted</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(242, 217, 200); stroke: rgb(242, 217, 200);"></rect><text x="22" y="14">Pending</text></g></g></svg>