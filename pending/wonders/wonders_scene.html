<!doctype html>
<html><head><meta charset="utf-8"><title>wonders — the scene</title>
<style>
  html,body{margin:0;height:100%;background:#101d33;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style></head>
<body>
<canvas id="c"></canvas>
<script>
/* The "wonders" scene: a horizon of silhouettes drifting right to left, the era changing as
   they pass. The app's own Aurora note sets the rule this follows - "the aurora burns at the
   edges and the middle is left calm" - so everything here lives in the bottom band and the
   middle of the frame, where the diagram sits, stays plain lapis.

   Speed is deliberately below the threshold where motion pulls the eye: one wonder crosses in
   about 90 seconds. Soften only blurs, it does not stop, so the scene has to be calm at source. */
const c = document.getElementById('c'), x = c.getContext('2d');
const PAL = { ground:'#101d33', deep:'#0a1425', stone:'#1b2c48', bronze:'#8d6a3c', gold:'#c9a227' };

let W, H, DPR;
function size(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = c.clientWidth; H = c.clientHeight;
  c.width = W * DPR; c.height = H * DPR;
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
}
size(); addEventListener('resize', size);

/* Each wonder is drawn into a unit box: 0..1 wide, 0..1 tall, baseline at y=1.
   Order is the arc: before the common era, through to the machine that reads this. */
const ERAS = [
  ['Pyramid',    (g,w,h)=>{ g.moveTo(0,h); g.lineTo(w/2,0); g.lineTo(w,h); }],
  ['Ziggurat',   (g,w,h)=>{ const s=4; for(let i=0;i<s;i++){ const t=i/s, b=(i+1)/s;
                   g.moveTo(w*t*0.42, h*(1-t)); g.lineTo(w-w*t*0.42, h*(1-t));
                   g.lineTo(w-w*b*0.42, h*(1-b)); g.lineTo(w*b*0.42, h*(1-b)); } }],
  ['Temple',     (g,w,h)=>{ g.moveTo(0,h*0.38); g.lineTo(w/2,0); g.lineTo(w,h*0.38); g.lineTo(w,h*0.46); g.lineTo(0,h*0.46);
                   for(let i=0;i<6;i++){ const cx=w*(0.08+i*0.168); g.moveTo(cx,h*0.46); g.lineTo(cx+w*0.05,h*0.46); g.lineTo(cx+w*0.05,h); g.lineTo(cx,h); } }],
  ['Aqueduct',   (g,w,h)=>{ g.moveTo(0,h*0.28); g.lineTo(w,h*0.28); g.lineTo(w,h*0.40); g.lineTo(0,h*0.40);
                   for(let i=0;i<4;i++){ const cx=w*(0.125+i*0.25), r=w*0.085;
                     g.moveTo(cx-r,h); g.lineTo(cx-r,h*0.62); g.arc(cx,h*0.62,r,Math.PI,0); g.lineTo(cx+r,h); g.lineTo(cx+r*0.6,h); g.lineTo(cx+r*0.6,h*0.66); g.arc(cx,h*0.66,r*0.6,0,Math.PI,true); g.lineTo(cx-r*0.6,h); } }],
  ['Cathedral',  (g,w,h)=>{ g.moveTo(w*0.42,h); g.lineTo(w*0.42,h*0.30); g.lineTo(w*0.5,0); g.lineTo(w*0.58,h*0.30); g.lineTo(w*0.58,h);
                   g.moveTo(w*0.16,h); g.lineTo(w*0.16,h*0.55); g.lineTo(w*0.30,h*0.42); g.lineTo(w*0.30,h);
                   g.moveTo(w*0.70,h); g.lineTo(w*0.70,h*0.42); g.lineTo(w*0.84,h*0.55); g.lineTo(w*0.84,h); }],
  ['Dome',       (g,w,h)=>{ g.moveTo(w*0.18,h); g.lineTo(w*0.18,h*0.52); g.lineTo(w*0.82,h*0.52); g.lineTo(w*0.82,h);
                   g.moveTo(w*0.24,h*0.52); g.arc(w*0.5,h*0.52,w*0.26,Math.PI,0); g.moveTo(w*0.47,h*0.24); g.lineTo(w*0.5,h*0.10); g.lineTo(w*0.53,h*0.24); }],
  ['Foundry',    (g,w,h)=>{ g.moveTo(0,h); g.lineTo(0,h*0.62); g.lineTo(w*0.62,h*0.62); g.lineTo(w*0.62,h);
                   g.moveTo(w*0.70,h); g.lineTo(w*0.74,h*0.10); g.lineTo(w*0.84,h*0.10); g.lineTo(w*0.88,h);
                   for(let i=0;i<3;i++){ const cx=w*(0.10+i*0.18); g.moveTo(cx,h*0.62); g.lineTo(cx,h*0.44); g.lineTo(cx+w*0.10,h*0.44); g.lineTo(cx+w*0.10,h*0.62); } }],
  ['Mast',       (g,w,h)=>{ g.moveTo(w*0.36,h); g.lineTo(w*0.46,0); g.lineTo(w*0.54,0); g.lineTo(w*0.64,h);
                   for(let i=1;i<7;i++){ const t=i/7, yy=h*t, sp=w*(0.10+0.16*t);
                     g.moveTo(w*0.5-sp,yy); g.lineTo(w*0.5+sp,yy); g.lineTo(w*0.5+sp,yy+h*0.02); g.lineTo(w*0.5-sp,yy+h*0.02); } }],
  ['Dish',       (g,w,h)=>{ g.moveTo(w*0.44,h); g.lineTo(w*0.44,h*0.58); g.lineTo(w*0.56,h*0.58); g.lineTo(w*0.56,h);
                   g.moveTo(w*0.16,h*0.56); g.arc(w*0.5,h*0.66,w*0.36,Math.PI*1.08,Math.PI*1.92); g.lineTo(w*0.5,h*0.66);
                   g.moveTo(w*0.30,h); g.lineTo(w*0.70,h); g.lineTo(w*0.70,h*0.94); g.lineTo(w*0.30,h*0.94); }],
  ['Rack',       (g,w,h)=>{ g.moveTo(w*0.20,h); g.lineTo(w*0.20,h*0.18); g.lineTo(w*0.80,h*0.18); g.lineTo(w*0.80,h);
                   for(let i=0;i<7;i++){ const yy=h*(0.24+i*0.10);
                     g.moveTo(w*0.26,yy); g.lineTo(w*0.74,yy); g.lineTo(w*0.74,yy+h*0.035); g.lineTo(w*0.26,yy+h*0.035); } }]
];

const CROSS_MS = 90000;          // one wonder crosses the frame in 90 seconds
const SPACING  = 0.21;           // as a fraction of the frame width

function paint(now){
  x.clearRect(0,0,W,H);

  // ---- ground: plain lapis, with a warmth that only reaches the bottom edge ----
  const sky = x.createLinearGradient(0,H*0.42,0,H);
  sky.addColorStop(0,   PAL.ground);
  sky.addColorStop(0.72,'#132b45');
  sky.addColorStop(1,   '#1a2338');
  x.fillStyle = PAL.ground; x.fillRect(0,0,W,H);
  x.fillStyle = sky;        x.fillRect(0,H*0.42,W,H*0.58);

  // a low sun, the colour of gold leaf, sitting just under the horizon line
  const hz = H*0.93;
  const glow = x.createRadialGradient(W*0.5,hz,0,W*0.5,hz,Math.max(W,H)*0.42);
  // Gold over lapis goes olive: yellow at low alpha on blue reads green. A warmer, redder
  // ember keeps the sense of a low sun without turning the horizon into pond water.
  glow.addColorStop(0,'rgba(176,104,44,.20)');
  glow.addColorStop(0.55,'rgba(150,86,48,.07)');
  glow.addColorStop(1,'rgba(150,86,48,0)');
  x.fillStyle = glow; x.fillRect(0,H*0.35,W,H*0.65);

  // ---- the horizon of wonders ----
  // First attempt put a tall band across the middle with a hard centre fade. The diagram sits
  // in the middle, so the arc could only ever be seen as two fragments at the edges. A low,
  // dense skyline reads as one continuous thing and never competes for the middle of the screen.
  const band = H*0.15;                       // how tall a silhouette may be
  const step = W*SPACING;
  const drift = (now % CROSS_MS) / CROSS_MS * step;
  const first = Math.floor(now / CROSS_MS);

  x.save();
  x.beginPath(); x.rect(0,0,W,hz); x.clip();  // never draw below the horizon line
  for (let i = -1; i < Math.ceil(W/step) + 2; i++){
    const [, drawFn] = ERAS[((first + i) % ERAS.length + ERAS.length) % ERAS.length];
    const px = W + step - (i*step + drift) - step;
    const w = step*0.52, h = band;
    // the middle of the frame is where the diagram sits: fade anything crossing it
    const centre = Math.abs((px + w/2) / W - 0.5);      // 0 at centre, .5 at the edges
    const alpha = 0.42 + 0.26 * Math.min(1, centre / 0.34);
    x.save();
    x.translate(px, hz - h);
    x.beginPath();
    drawFn(x, w, h);
    // A silhouette must be DARKER than the sky behind it. stone (#1b2c48) is lighter than
    // ground (#101d33), so the shapes were vanishing exactly where the ember brightens the
    // horizon - the one place a skyline should read most clearly.
    x.fillStyle = PAL.deep;
    x.globalAlpha = alpha;
    x.fill();
    x.restore();
  }
  x.restore();

  // the horizon itself, a bronze hairline
  x.strokeStyle = 'rgba(141,106,60,.55)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(0,hz+0.5); x.lineTo(W,hz+0.5); x.stroke();

}

/* ?t=<milliseconds> paints that one instant and stops, so a still can be taken at a chosen
   point in the cycle. Without it the scene simply runs. */
const q = new URLSearchParams(location.search);
if (q.has('t')) {
  paint(Number(q.get('t')));
} else {
  requestAnimationFrame(function loop(ts) { paint(ts); requestAnimationFrame(loop); });
}
</script>
</body>
</html>
